<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .paper{fill:#F5F1E8}
      .ink{fill:#1C1A17}
      .accent{fill:#8B2E1C}
      .mute{fill:#8A8578}
      .h1{font-family:'Noto Sans KR','Pretendard',sans-serif;font-weight:800;letter-spacing:-2px}
      .ital{font-family:'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:-1.5px}
      .mono{font-family:'JetBrains Mono','Menlo',monospace;letter-spacing:3px}
      .body{font-family:'Noto Sans KR','Pretendard',sans-serif;font-weight:500}
    </style>
  </defs>

  <!-- 배경 베이지 -->
  <rect width="1200" height="630" class="paper"/>

  <!-- 상단 라벨 -->
  <text x="600" y="100" class="mono ink" font-size="13" font-weight="600" text-anchor="middle" opacity="0.5">GROWTHPILOT</text>

  <!-- 큰 메인 카피 (가운데 정렬, 비교 강조) -->
  <text x="600" y="240" class="ital ink" font-size="88" text-anchor="middle">외주는 한 번.</text>
  <text x="600" y="360" class="h1 accent" font-size="100" text-anchor="middle">GP는 매주.</text>

  <!-- 구분선 -->
  <line x1="500" y1="410" x2="700" y2="410" stroke="#1C1A17" stroke-width="1" opacity="0.3"/>

  <!-- 서브 카피 -->
  <text x="600" y="465" class="body ink" font-size="24" text-anchor="middle" opacity="0.75">광고 + DM 자동화 + 매주 변형 운영</text>

  <!-- 하단 라인 -->
  <text x="600" y="555" class="body ink" font-size="18" text-anchor="middle" opacity="0.55">1인샵 · 메이크업 · 사진 · PT · 한의원</text>
  <text x="600" y="588" class="mono accent" font-size="13" font-weight="700" text-anchor="middle">growthpilot.co.kr</text>
</svg>
