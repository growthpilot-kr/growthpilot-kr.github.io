<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .paper{fill:#F5F1E8}
      .paper-deep{fill:#EEE8DA}
      .ink{fill:#1C1A17}
      .accent{fill:#8B2E1C}
      .mute{fill:#8A8578}
      .h1{font-family:'Noto Sans KR','Pretendard',sans-serif;font-weight:800;letter-spacing:-2px}
      .ital{font-family:'Times New Roman',serif;font-style:italic;font-weight:300;letter-spacing:-2.5px}
      .mono{font-family:'JetBrains Mono','Menlo',monospace;letter-spacing:3px}
      .body{font-family:'Noto Sans KR','Pretendard',sans-serif;font-weight:400}
    </style>
  </defs>

  <!-- 배경 베이지 -->
  <rect width="1200" height="630" class="paper"/>

  <!-- 좌측 마스코트 자리 (큰 영역) -->
  <rect x="0" y="0" width="450" height="630" class="paper-deep"/>
  <circle cx="225" cy="315" r="160" fill="#F5F1E8"/>
  <text x="225" y="310" class="body ink" font-size="14" opacity="0.4" text-anchor="middle">[마스코트 자리]</text>
  <text x="225" y="335" class="body ink" font-size="14" opacity="0.4" text-anchor="middle">pointing.png</text>

  <!-- 우측 카피 영역 -->
  <text x="510" y="180" class="mono ink" font-size="13" font-weight="600" opacity="0.5">DIAGNOSE &amp; SOLVE</text>

  <!-- 메인 카피 -->
  <text x="510" y="290" class="ital ink" font-size="62">지금,</text>
  <text x="510" y="380" class="h1 accent" font-size="70">어디서 막혀</text>
  <text x="510" y="455" class="h1 accent" font-size="70">있나요?</text>

  <!-- 서브 -->
  <text x="510" y="520" class="body ink" font-size="20" opacity="0.65">매주 같이 결정하는 마케팅 동료.</text>

  <!-- 하단 -->
  <text x="510" y="585" class="mono ink" font-size="13" font-weight="700">growthpilot.co.kr</text>
</svg>
